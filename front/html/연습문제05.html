<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>주문관리</title>

    <style>
        /*
            ================================
            페이지 전체 기본 설정
            ================================
        */
        body {
            font-family: Arial, "맑은 고딕", sans-serif;
        }


        /*
            ================================
            각 큰 영역 사이 간격
            ================================
        */
        .section {
            margin-bottom: 55px;
        }


        /*
            ================================
            주문자 정보의 번호 목록
            ================================
        */
        .orderer-list li {
            margin-bottom: 28px;
        }


        /*
            ================================
            주문정보의 점 목록
            ================================
        */
        .order-list li {
            margin-bottom: 24px;
        }


        /*
            ================================
            일반 입력창 너비
            ================================
        */
        input[type="text"],
        input[type="email"],
        input[type="url"] {
            width: 170px;
        }


        /*
            ================================
            요청사항 textarea
            ================================
        */
        textarea {
            width: 155px;
            height: 30px;
        }
    </style>
</head>


<body>

    <!--
        =====================================
        페이지 가장 큰 제목
        =====================================
    -->
    <h1>주문관리</h1>


    <!--
        form
        → 사용자 입력값들을 하나로 묶는 태그

        action=""
        → 데이터를 보낼 주소
        현재는 연습용이기 때문에 비워둠

        method="post"
        → 입력한 데이터를 전송하는 방식 중 하나
    -->
    <form action="" method="post">


        <!--
            =====================================
            주문자 정보 영역
            =====================================
        -->
        <div class="section">

            <h2>주문자 정보</h2>

            <!--
                ol
                → 순서가 있는 목록

                자동으로
                1.
                2.
                3.
                번호가 붙는다.
            -->
            <ol class="orderer-list">

                <!-- ============================ -->
                <!-- 1. 주문자명 -->
                <!-- ============================ -->
                <li>

                    <label for="name">
                        주문자명 :
                    </label>

                    <!--
                        type="text"
                        → 일반 문자 입력창

                        placeholder="name"
                        → 입력하지 않았을 때
                          입력창 안에 연한 안내 문구가 표시됨
                    -->
                    <input type="text"
                           id="name"
                           name="name"
                           placeholder="name">

                </li>


                <!-- ============================ -->
                <!-- 2. 이메일 -->
                <!-- ============================ -->
                <li>

                    <label for="email">
                        email :
                    </label>

                    <!--
                        type="email"
                        → 이메일 입력용

                        placeholder
                        → 사진처럼
                          1dragon@yaho.com
                          문구가 연하게 보이게 함
                    -->
                    <input type="email"
                           id="email"
                           name="email"
                           placeholder="1dragon@yaho.com">

                </li>


                <!-- ============================ -->
                <!-- 3. 홈페이지 -->
                <!-- ============================ -->
                <li>

                    <label for="homepage">
                        홈페이지 :
                    </label>

                    <!--
                        type="url"
                        → 웹사이트 주소 입력용

                        placeholder="http://"
                        → 사진처럼 http:// 표시
                    -->
                    <input type="url"
                           id="homepage"
                           name="homepage"
                           placeholder="http://">

                </li>

            </ol>

        </div>


        <!--
            =====================================
            주문정보 영역
            =====================================
        -->
        <div class="section">

            <h2>주문정보</h2>

            <!--
                ul
                → 순서가 없는 목록

                각 항목 앞에 ● 점이 붙는다.
            -->
            <ul class="order-list">

                <!-- ============================ -->
                <!-- 상품명 -->
                <!-- ============================ -->
                <li>

                    <label for="product">
                        상품명 :
                    </label>

                    <input type="text"
                           id="product"
                           name="product">

                </li>


                <!-- ============================ -->
                <!-- 주문수량 -->
                <!-- ============================ -->
                <li>

                    <label for="quantity">
                        주문수량 :
                    </label>

                    <!--
                        type="number"
                        → 숫자를 입력하는 입력창

                        min="100"
                        → 최소값을 100으로 제한

                        placeholder="최소 100"
                        → 입력창에 안내 문구 표시
                    -->
                    <input type="number"
                           id="quantity"
                           name="quantity"
                           min="100"
                           placeholder="최소 100">

                </li>


                <!-- ============================ -->
                <!-- 할인율 -->
                <!-- ============================ -->
                <li>

                    <label for="discount">
                        할인율 :
                    </label>

                    <!--
                        type="range"
                        → 슬라이더 형태의 입력창

                        min="0"
                        → 최소값

                        max="100"
                        → 최대값

                        value="50"
                        → 처음 슬라이더 위치
                    -->
                    <input type="range"
                           id="discount"
                           name="discount"
                           min="0"
                           max="100"
                           value="50">

                </li>


                <!-- ============================ -->
                <!-- 요청사항 -->
                <!-- ============================ -->
                <li>

                    <label for="request">
                        요청사항 :
                    </label>

                    <!--
                        textarea
                        → 여러 줄 입력이 가능한 입력창
                    -->
                    <textarea id="request"
                              name="request"></textarea>

                </li>

            </ul>

        </div>


        <!--
            =====================================
            주문하기 버튼
            =====================================
        -->

        <!--
            type="submit"
            → form 안에 입력한 내용을 전송하는 버튼
        -->
        <button type="submit">
            주문하기
        </button>


    </form>

</body>
</html>
