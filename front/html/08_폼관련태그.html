<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>폼관련태그</title>
</head>
<body>

  <h1>폼관련태그</h1>

  <hr />

  <!--  
      <form> 태그
          form 태그는 html에서 사용자가 입력할 수 있는 양식을 제공하는 태그이다.
          form 태그 내의 <input> 태그들을 통해서 사용자가 입력한 정보를 서버로 넘기면서 요청하는 역할을 한다.

      * 속성
          action : 폼 내에 입력된 값들을 전달할 서버에 대한 내용을 기입한다.
          method : get / post 방식으로 전송 방식을 지정한다.
              get : 서버에 사용자가 입력한 값들을 URL에 노출시켜서 전달하는 방식
              post : 서버에 사용자가 입력한 값들을 URL에 노출시키지 않고 전달하는 방식
          autocomplete : 이전 입력 내용을 출력하는 기능(default : on, 각 태그별로 지정 가능)
  -->

  <form action="네이버" method="get">
    <label>아이디 : </label>
    <input 
      type="text" 
      placeholder="4~12글자 사이로 입력해주세요" 
      name="x" 
      value="user01" 
      readonly>
    <br />

    <label>비밀번호 : </label>
    <input type="password" name="y">
    <br />

    <label>닉네임 : </label>
    <input type="text" name="nickname" maxlength="20" placeholder="닉네임~~~" required>
    <br />

    <input type="range" min="0" max="100" step="20" value="80">
    <br />

    <input type="datetime-local">
    <br />

    <label for="target01">남자</label>
    <input id="target01" type="radio" name="gender" value="male">
    <label>
      여자
      <input type="radio" name="gender" value="female">
    </label>
    <br />

    <label>
      코딩
      <input type="checkbox" name="hobby" value="coding">
    </label>
    <label>
      프로그래밍
      <input type="checkbox" name="hobby" value="programming">
    </label>
    <label>
      개발
      <input type="checkbox" name="hobby" value="development">
    </label>
    <br />

    <input type="color">
    <br />

    <input type="file" multiple accept=".jpg,.png">
    <br />

    <input type="hidden" name="abc" value="123">
    <br />
    
    <select name="national">
      <optgroup label="아시아">
        <option value="ko" selected>한국</option>
        <option value="jp">일본</option>
        <option value="ch">중국</option>
      </optgroup>
      <optgroup label="유럽">
        <option value="fr">프랑스</option>
      </optgroup>
    </select>
    <br>

    <progress></progress>
    <br />

    <meter min="0" max="100" value="50" low="25" high="75"></meter>
    <br />

    <textarea name="content"></textarea>
    <br>

    <button type="button">버튼태그ㅋㅋ</button>
    <input type="button" value="그냥버튼">
    <input type="submit" value="로그인">
    <input type="reset" value="리셋">

  </form>



















  <br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>
  
  
</body>
</html>
