<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>구글 로그인 연습</title>

    <link rel="stylesheet" href="구글로그인.css" />
  </head>

  <body>
    <div class="container">
      <!-- 왼쪽 -->
      <div class="left">
        <div class="logo">G</div>
        <div class="title">로그인</div>
        <div class="text">Google 계정 사용</div>
      </div>

      <!-- 오른쪽 -->
      <div class="right">
        <div class="right-top">
          <input type="text" placeholder="이메일 또는 휴대전화" />
          <p>이메일을 잊으셨나요?</p>
        </div>

        <div class="right-mid">
          내 컴퓨터가 아닌가요?<br />
          게스트 모드를 사용하여 비공개로 로그인하세요.
        </div>

        <div class="right-bot">
          <span>계정 만들기</span>
          <button>다음</button>
        </div>
      </div>
    </div>
  </body>
</html>
